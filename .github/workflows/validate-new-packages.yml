name: Validate new packages

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  validate-new-packages:
    name: Validate new skill packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pull request base
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate newly added packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/validate-new-packages.py "$BASE_SHA"
